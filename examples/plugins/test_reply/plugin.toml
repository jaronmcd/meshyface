api_version = 1
id = "test_reply"
name = "Test Reply"
version = "1.0.0"
entrypoint = "script.py:script"
commands = []
default_enabled = false

[[settings]]
key = "trigger_patterns"
label = "Trigger patterns"
type = "text"
default = "*test*, *ping*"
placeholder = "*test*, *ping*"
max_length = 512
description = "Comma-separated shell-style wildcard patterns. Matching is case-insensitive."

[[settings]]
key = "response_template"
label = "Response template"
type = "text"
default = "{hops} to {nearest_city}"
placeholder = "{sender}: {hops}"
max_length = 256
description = "Reply text with macros like {hops}, {nearest_city}, {sender}, {snr}, and {rssi}."

[[settings]]
key = "reply_to_broadcast"
label = "Reply to broadcasts"
type = "boolean"
default = true
description = "Reply when a matching message is sent to the public channel."

[[settings]]
key = "reply_to_direct"
label = "Reply to direct messages"
type = "boolean"
default = true
description = "Reply when a matching message is sent directly to this node."
